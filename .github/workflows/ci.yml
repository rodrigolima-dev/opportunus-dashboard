name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit and isolation tests
        run: npm test
      - name: Types
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: HTTP security smoke
        run: npm run test:http
      - name: Tracked secret patterns
        run: npm run security:secrets
      - name: History secret patterns
        run: npm run security:history
